services:
  postgres:
    image: postgres:17-alpine
    container_name: fieldos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldos
      POSTGRES_PASSWORD: fieldos_dev_password
      POSTGRES_DB: fieldos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldos -d fieldos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fieldos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: